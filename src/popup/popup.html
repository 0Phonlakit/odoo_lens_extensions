<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Odoo Lens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-9 9M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></symbol>
  </svg>

  <header class="head">
    <span class="logo" aria-hidden="true"></span>
    <b class="name">Odoo Lens</b>
    <button class="icon-btn" id="btn-back" type="button" data-act="back" hidden><svg class="i" aria-hidden="true"><use href="#i-back"/></svg>กลับ</button>
  </header>

  <div class="db" id="db" hidden>
    <span class="dot"></span>
    <div class="db-main">
      <div class="dbname"><span class="muted">DB</span><b id="db-name"></b><span class="tag" id="db-tag"></span></div>
      <div class="sub" id="db-sub"></div>
    </div>
    <button class="btn sm" type="button" data-act="go" data-view="password"><svg class="i" aria-hidden="true"><use href="#i-key"/></svg>เปลี่ยนรหัสผ่าน</button>
  </div>

  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button id="tab-data" type="button" role="tab" data-act="panel" data-panel="data" aria-selected="true">ข้อมูล</button>
    <button id="tab-log" type="button" role="tab" data-act="panel" data-panel="log" aria-selected="false">Log ของหน้านี้ <span class="count" id="log-count">0</span></button>
  </nav>

  <main id="body"><p class="muted center">กำลังเชื่อมต่อ…</p></main>
  <main id="log-body" hidden></main>
  <footer id="foot" hidden></footer>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
